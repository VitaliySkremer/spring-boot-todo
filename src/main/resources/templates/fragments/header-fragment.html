<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Header Fragment</title>
</head>
<body>
<div th:fragment="header-fragment (userName)" class="navbar-wrapper">
    <div class="navbar-container">
        <div class="navbar-container__left-menu">
            <div class="navbar-container__controls">
                <a href="/" class="navbar-container__controls-link">Home</a>
            </div>
            <div class="navbar-container__controls">
                <a href="/account" class="navbar-container__controls-link">Account</a>
            </div>
            <div sec:authorize="hasAnyRole('ROLE_ADMIN', 'ROLE_SUPER_ADMIN')" class="navbar-container__controls">
                <a href="/management/admin" class="navbar-container__controls-link">Management</a>
            </div>
        </div>
        <div class="navbar-container__right-menu">
            <div class="navbar-container__controls">
                <span class="navbar-container__controls-text">(User: [[${userName}]])</span>
                <form action="/logout" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="navbar-container__controls-link">Logout</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
